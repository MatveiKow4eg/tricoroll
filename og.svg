<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Tricoroll OÜ — tööjõurent Eestis">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#EFF4FA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="980" cy="80" r="260" fill="#062E58" opacity="0.08"/>
  <circle cx="1020" cy="520" r="320" fill="#062E58" opacity="0.06"/>

  <!-- simple mark -->
  <g transform="translate(120,130)">
