    <text x="0" y="140" font-family="Roboto, Arial, sans-serif" font-size="30" font-weight="400" fill="#4A5F73">Kiire komplekteerimine • Paindlik teenus • Kogenud töötajad</text>
  </g>

  <g transform="translate(120,475)">
